name: Release

# Publishes a release whenever main gets a new version number (npm run release), or when started by hand
# from the Actions tab. Builds the Windows installer, signs it for the in-app updater, and publishes a GitHub
# Release (tag vX.Y.Z) with the installer and latest.json, which installed copies of PDForge read to find
# new versions. A version that already has a published release is skipped.
on:
  push:
    branches: [main]
    paths: ["src-tauri/tauri.conf.json", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version, and whether it's already released
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but the app version is $tag. Use npm run release to set the version."
            exit 1
          fi
          if [ "$(gh release view "$tag" --json isDraft -q '.isDraft' 2>/dev/null)" = "false" ]; then
            echo "$tag is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.version.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: steps.version.outputs.skip != 'true'
        run: npm ci
      - if: steps.version.outputs.skip != 'true'
        run: npm test

      - name: Check the update signing key is set
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Write release notes
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The newest earlier release tag, if any.
          previous=$(git tag --list 'v*' --sort=-version:refname | grep -vx "$TAG" | head -1)
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range="HEAD"; fi
          {
            echo "Changes in this version:"
            echo
            git log --no-merges --format='- %s' "$range" | grep -v '^- Release [0-9]' | head -60
            echo
            echo "Installed copies of PDForge (0.2.0 and later) offer this update on their own. To install by hand, download the setup .exe below."
          } > release-notes.md
          cat release-notes.md

      - if: steps.version.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: PDForge ${{ steps.version.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: See the notes below.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # Publish only once everything is uploaded, so the updater never sees a half-finished release.
      - name: Publish the release with its notes
        if: steps.version.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --notes-file release-notes.md --draft=false --latest
