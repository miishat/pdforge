[package]
name = "pdforge"
version = "0.2.4"
description = "A local-first PDF suite for Windows"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "pdforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-process = "=2.4.0"

# Snap Layouts, the taskbar jump list and default-app registration (src/shell.rs). Same version Tauri uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Opened files in the Dock's recent documents (src/shell.rs). Same versions Tauri uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDocumentController"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
